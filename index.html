<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hold On,Buddy!</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #0d0f18;
            color: #ffffff;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .pixel-font {
            font-family: 'Press Start 2P', monospace;
        }
        .neon-border {
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.5), inset 0 0 15px rgba(236, 72, 153, 0.3);
        }
        .neon-text-cyan {
            text-shadow: 0 0 8px rgba(6, 182, 212, 0.8), 0 0 20px rgba(6, 182, 212, 0.5);
        }
        .neon-text-pink {
            text-shadow: 0 0 8px rgba(236, 72, 153, 0.8), 0 0 20px rgba(236, 72, 153, 0.5);
        }
        .touch-btn:active {
            transform: scale(0.92);
            filter: brightness(1.3);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-2 sm:p-4 overflow-hidden">

    <!-- Header / HUD -->
    <header class="w-full max-w-lg flex items-center justify-between bg-slate-900/80 border-2 border-pink-500/50 rounded-xl p-3 mb-2 neon-border backdrop-blur-md">
        <div class="flex flex-col">
            <span class="text-xs text-cyan-400 font-bold uppercase tracking-wider">Survived Time</span>
            <span id="timerDisplay" class="pixel-font text-xl sm:text-2xl text-yellow-300 neon-text-cyan">0.00s</span>
        </div>
        
        <!-- Shield Skill UI Indicator -->
        <div class="flex flex-col items-end">
            <span class="text-xs text-pink-400 font-bold uppercase tracking-wider">Special Skill</span>
            <div id="dodgeBadge" class="mt-1 px-3 py-1 text-xs font-bold rounded-md bg-emerald-500/20 text-emerald-300 border border-emerald-400/50 flex items-center gap-1.5 transition-all">
                <span id="dodgeDot" class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span id="dodgeBadgeText" class="pixel-font text-[10px]">SHIELD [x1]</span>
            </div>
        </div>
    </header>

    <!-- Main Game Canvas Container -->
    <main class="relative w-full max-w-lg aspect-[4/5] sm:aspect-square flex items-center justify-center bg-slate-950 rounded-2xl overflow-hidden border-2 border-cyan-500/40 shadow-2xl">
        <canvas id="gameCanvas" class="w-full h-full block"></canvas>

        <!-- Start Overlay -->
        <div id="startOverlay" class="absolute inset-0 bg-slate-950/90 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center z-20">
            <h1 class="pixel-font text-2xl sm:text-3xl text-pink-500 mb-2 neon-text-pink leading-relaxed">Hold On,Buddy!</h1>
            <p class="text-slate-300 text-sm sm:text-base max-w-xs mb-3 leading-relaxed">
                날아오는 총알을 피하고 생존하세요!
            </p>

            <div class="bg-slate-900/80 border border-slate-700 rounded-lg p-3 mb-4 w-full max-w-xs text-xs text-slate-400 space-y-1 text-left">
                <p>⚡ <strong class="text-slate-200">조작:</strong> 방향키 / 터치 조이스틱</p>
                <p>🛡️ <strong class="text-cyan-300">실드(1초 무적):</strong> 스페이스바, 10초마다 출현</p>
            </div>

            <!-- Volume Slider Container -->
            <div class="w-full max-w-xs bg-slate-900/90 border border-cyan-500/30 rounded-xl p-3 mb-4 flex flex-col gap-1.5 text-xs text-left shadow-inner">
                <div class="flex justify-between items-center">
                    <span class="text-cyan-400 font-bold flex items-center gap-1.5">
                        🔊 <span class="pixel-font text-[10px]">MASTER VOLUME</span>
                    </span>
                    <span id="volumeValue" class="pixel-font text-yellow-300 text-[10px]">80%</span>
                </div>
                <input id="volumeSlider" type="range" min="0" max="100" value="80" 
                    class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-pink-500 focus:outline-none">
            </div>

            <!-- Mode Selection Buttons -->
            <div class="flex flex-col sm:flex-row gap-3 w-full max-w-xs">
                <button id="startNormalBtn" class="flex-1 pixel-font py-3.5 bg-gradient-to-r from-pink-500 to-rose-600 hover:from-pink-400 hover:to-rose-500 text-white text-xs rounded-xl shadow-lg shadow-pink-500/30 transform active:scale-95 transition-all cursor-pointer">
                    NORMAL
                </button>
                <button id="startHellBtn" class="flex-1 pixel-font py-3.5 bg-gradient-to-r from-red-600 to-purple-800 hover:from-red-500 hover:to-purple-700 text-white text-xs rounded-xl shadow-lg shadow-red-600/40 border border-red-400/40 transform active:scale-95 transition-all cursor-pointer flex items-center justify-center gap-1">
                    🔥 HELL
                </button>
            </div>
        </div>

        <!-- 3, 2, 1 Countdown Overlay -->
        <div id="countdownOverlay" class="absolute inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center z-30 hidden">
            <span id="countdownText" class="pixel-font text-6xl text-yellow-300 neon-text-pink animate-ping">3</span>
        </div>

        <!-- Game Over Overlay -->
        <div id="gameOverOverlay" class="absolute inset-0 bg-slate-950/95 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-20 hidden">
            <h2 class="pixel-font text-2xl sm:text-3xl text-red-500 mb-2 animate-bounce">GAME OVER</h2>
            <p id="gameOverModeText" class="text-xs font-bold text-pink-400 mb-2">[NORMAL MODE]</p>
            <p class="text-slate-400 text-xs sm:text-sm mb-4">총알에 맞고 폭발했습니다!</p>
            
            <div class="bg-slate-900 border border-pink-500/30 rounded-xl p-4 w-full max-w-xs mb-4 space-y-2">
                <div class="flex justify-between items-center text-sm">
                    <span class="text-slate-400">이번 기록:</span>
                    <span id="finalScore" class="pixel-font text-lg text-yellow-300">0.00s</span>
                </div>
                <div class="flex justify-between items-center text-sm border-t border-slate-800 pt-2">
                    <span class="text-slate-400">최고 기록:</span>
                    <span id="highScore" class="pixel-font text-lg text-cyan-400">0.00s</span>
                </div>
            </div>

            <!-- Volume Slider Container for GameOver Screen -->
            <div class="w-full max-w-xs bg-slate-900/90 border border-cyan-500/30 rounded-xl p-3 mb-4 flex flex-col gap-1.5 text-xs text-left shadow-inner">
                <div class="flex justify-between items-center">
                    <span class="text-cyan-400 font-bold flex items-center gap-1.5">
                        🔊 <span class="pixel-font text-[10px]">MASTER VOLUME</span>
                    </span>
                    <span id="volumeValueGameOver" class="pixel-font text-yellow-300 text-[10px]">80%</span>
                </div>
                <input id="volumeSliderGameOver" type="range" min="0" max="100" value="80" 
                    class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-pink-500 focus:outline-none">
            </div>

            <!-- Mode Selection & Restart Buttons on GameOver -->
            <div class="flex flex-col sm:flex-row gap-3 w-full max-w-xs">
                <button id="restartNormalBtn" class="flex-1 pixel-font py-3.5 bg-gradient-to-r from-pink-500 to-rose-600 hover:from-pink-400 hover:to-rose-500 text-white text-xs rounded-xl shadow-lg shadow-pink-500/30 transform active:scale-95 transition-all cursor-pointer">
                    NORMAL
                </button>
                <button id="restartHellBtn" class="flex-1 pixel-font py-3.5 bg-gradient-to-r from-red-600 to-purple-800 hover:from-red-500 hover:to-purple-700 text-white text-xs rounded-xl shadow-lg shadow-red-600/40 border border-red-400/40 transform active:scale-95 transition-all cursor-pointer flex items-center justify-center gap-1">
                    🔥 HELL
                </button>
            </div>
        </div>
    </main>

    <!-- Controls Footer -->
    <footer class="w-full max-w-lg mt-2 flex items-center justify-between gap-4 p-2 bg-slate-900/60 border border-slate-800 rounded-xl">
        <!-- Virtual Joystick Area -->
        <div id="joystickZone" class="relative w-36 h-36 sm:w-40 sm:h-40 bg-slate-950/90 rounded-full border-2 border-cyan-500/40 flex items-center justify-center touch-none shadow-inner overflow-hidden cursor-pointer">
            <div class="absolute inset-0 rounded-full border border-cyan-400/20 pointer-events-none"></div>
            <div id="joystickStick" class="w-12 h-12 rounded-full bg-gradient-to-br from-cyan-400 to-blue-600 border-2 border-white shadow-lg transform transition-transform duration-75"></div>
        </div>

        <!-- Touch Shield Button -->
        <button id="btnDodge" class="touch-btn flex-1 h-36 sm:h-40 bg-gradient-to-br from-pink-600 to-purple-700 border-2 border-pink-400 active:from-pink-400 active:to-purple-500 rounded-xl flex flex-col items-center justify-center gap-1 shadow-lg shadow-pink-500/20 cursor-pointer">
            <span class="text-2xl sm:text-3xl">🛡️</span>
            <span class="pixel-font text-xs sm:text-sm text-white font-bold">SHIELD</span>
            <span id="btnDodgeSubText" class="text-[10px] text-pink-200/80">(충전: 1회)</span>
        </button>
    </footer>

    <!-- Script Logic -->
    <script>
        // --- Sound Engine ---
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.bgmTimer = null;
                this.isPlayingBgm = false;
                this.masterVolume = 0.8;
                this.masterGain = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    this.masterGain = this.ctx.createGain();
                    this.masterGain.gain.value = this.masterVolume;
                    this.masterGain.connect(this.ctx.destination);
                } else if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            setVolume(val) {
                this.masterVolume = Math.max(0, Math.min(1, val));
                if (this.masterGain && this.ctx) {
                    this.masterGain.gain.setValueAtTime(this.masterVolume, this.ctx.currentTime);
                }
            }
            playBeep(freq = 600, duration = 0.15) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.masterGain || this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            }
            playDodge() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.masterGain || this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }
            playItem() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, this.ctx.currentTime);
                osc.frequency.setValueAtTime(659.25, this.ctx.currentTime + 0.08);
                osc.frequency.setValueAtTime(783.99, this.ctx.currentTime + 0.16);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.masterGain || this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }
            playExplosion() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.6);
                gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.6);
                osc.connect(gain);
                gain.connect(this.masterGain || this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.6);
            }
            playBounce() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.masterGain || this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }

            startBGM() {
                if (!this.ctx || this.isPlayingBgm) return;
                this.isPlayingBgm = true;

                const melody = [
                    523.25, 659.25, 783.99, 1046.50, 783.99, 659.25, 523.25, 440.00,
                    493.88, 587.33, 698.46, 880.00,  698.46, 587.33, 493.88, 392.00,
                    440.00, 523.25, 659.25, 783.99,  659.25, 523.25, 440.00, 349.23,
                    392.00, 493.88, 587.33, 698.46,  587.33, 493.88, 392.00, 523.25
                ];
                let step = 0;

                const playNote = () => {
                    if (!this.isPlayingBgm || !this.ctx) return;

                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = (step % 4 === 0) ? 'square' : 'sawtooth';
                    osc.frequency.setValueAtTime(melody[step % melody.length], now);

                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

                    osc.connect(gain);
                    gain.connect(this.masterGain || this.ctx.destination);

                    osc.start(now);
                    osc.stop(now + 0.14);

                    if (step % 2 === 0) {
                        const bassOsc = this.ctx.createOscillator();
                        const bassGain = this.ctx.createGain();
                        bassOsc.type = 'triangle';
                        bassOsc.frequency.setValueAtTime(step % 8 === 0 ? 110 : 87.31, now);
                        bassGain.gain.setValueAtTime(0.15, now);
                        bassGain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
                        bassOsc.connect(bassGain);
                        bassGain.connect(this.masterGain || this.ctx.destination);
                        bassOsc.start(now);
                        bassOsc.stop(now + 0.18);
                    }

                    step++;
                };

                this.bgmTimer = setInterval(playNote, 130);
            }

            stopBGM() {
                this.isPlayingBgm = false;
                if (this.bgmTimer) {
                    clearInterval(this.bgmTimer);
                    this.bgmTimer = null;
                }
            }
        }
        const audio = new SoundEngine();

        // Volume Controls
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeValue = document.getElementById('volumeValue');
        const volumeSliderGameOver = document.getElementById('volumeSliderGameOver');
        const volumeValueGameOver = document.getElementById('volumeValueGameOver');

        function handleVolumeChange(val) {
            if (volumeValue) volumeValue.innerText = `${val}%`;
            if (volumeValueGameOver) volumeValueGameOver.innerText = `${val}%`;
            if (volumeSlider) volumeSlider.value = val;
            if (volumeSliderGameOver) volumeSliderGameOver.value = val;
            
            audio.init();
            audio.setVolume(val / 100);
        }

        if (volumeSlider) {
            volumeSlider.addEventListener('input', (e) => handleVolumeChange(parseInt(e.target.value)));
        }
        if (volumeSliderGameOver) {
            volumeSliderGameOver.addEventListener('input', (e) => handleVolumeChange(parseInt(e.target.value)));
        }

        // --- Game Setup & State ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const timerDisplay = document.getElementById('timerDisplay');
        const dodgeBadge = document.getElementById('dodgeBadge');
        const dodgeBadgeText = document.getElementById('dodgeBadgeText');
        const dodgeDot = document.getElementById('dodgeDot');
        const btnDodgeSubText = document.getElementById('btnDodgeSubText');
        
        const startOverlay = document.getElementById('startOverlay');
        const countdownOverlay = document.getElementById('countdownOverlay');
        const countdownText = document.getElementById('countdownText');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const startNormalBtn = document.getElementById('startNormalBtn');
        const startHellBtn = document.getElementById('startHellBtn');
        const restartNormalBtn = document.getElementById('restartNormalBtn');
        const restartHellBtn = document.getElementById('restartHellBtn');
        const gameOverModeText = document.getElementById('gameOverModeText');
        
        const finalScore = document.getElementById('finalScore');
        const highScoreDisplay = document.getElementById('highScore');

        const CANVAS_WIDTH = 500;
        const CANVAS_HEIGHT = 625;
        canvas.width = CANVAS_WIDTH;
        canvas.height = CANVAS_HEIGHT;

        let gameState = 'START'; 
        let gameMode = 'NORMAL'; 
        let startTime = 0;
        let elapsedTime = 0;
        let animationFrameId = null;

        // Pac-Man Player
        const player = {
            x: CANVAS_WIDTH / 2,
            y: CANVAS_HEIGHT / 2,
            radius: 14,
            width: 28,
            height: 28,
            speed: 4.5,
            dodgeCharges: 1,
            isInvincible: false,
            invincibleUntil: 0,
            angle: 0,
            mouthAngle: 0.2,
            mouthSpeed: 0.04
        };

        const keys = { Up: false, Down: false, Left: false, Right: false };
        let joystickVector = { x: 0, y: 0 };

        let bullets = [];
        let particles = [];
        let items = [];
        let spawnTimer = 0;
        let lastItemSpawnTime = 0;

        let highScoreNormal = parseFloat(localStorage.getItem('car_dodge_highscore_normal') || '0');
        let highScoreHell = parseFloat(localStorage.getItem('car_dodge_highscore_hell') || '0');

        // Keyboard Controls
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.Up = true;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.Down = true;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.Left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.Right = true;
            if (e.code === 'Space') {
                e.preventDefault();
                triggerDodge();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.Up = false;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.Down = false;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.Left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.Right = false;
        });

        // Joystick Controls
        const joystickZone = document.getElementById('joystickZone');
        const joystickStick = document.getElementById('joystickStick');
        let isJoystickActive = false;

        function updateJoystick(evt) {
            if (!isJoystickActive) return;
            const rect = joystickZone.getBoundingClientRect();
            const touch = evt.touches ? evt.touches[0] : evt;
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            const maxRadius = rect.width / 2 - 20;
            const distance = Math.hypot(dx, dy);

            if (distance > maxRadius) {
                dx = (dx / distance) * maxRadius;
                dy = (dy / distance) * maxRadius;
            }

            joystickStick.style.transform = `translate(${dx}px, ${dy}px)`;
            
            if (distance > 8) {
                joystickVector.x = dx / maxRadius;
                joystickVector.y = dy / maxRadius;
            } else {
                joystickVector.x = 0;
                joystickVector.y = 0;
            }
        }

        function resetJoystick() {
            isJoystickActive = false;
            joystickVector = { x: 0, y: 0 };
            joystickStick.style.transform = `translate(0px, 0px)`;
        }

        joystickZone.addEventListener('touchstart', (e) => { isJoystickActive = true; updateJoystick(e); });
        window.addEventListener('touchmove', (e) => { if (isJoystickActive) updateJoystick(e); });
        window.addEventListener('touchend', resetJoystick);

        joystickZone.addEventListener('mousedown', (e) => { isJoystickActive = true; updateJoystick(e); });
        window.addEventListener('mousemove', (e) => { if (isJoystickActive) updateJoystick(e); });
        window.addEventListener('mouseup', resetJoystick);

        // Shield Button
        document.getElementById('btnDodge').addEventListener('click', (e) => {
            e.preventDefault();
            triggerDodge();
        });

        // Mode Buttons Listeners
        startNormalBtn.addEventListener('click', () => { gameMode = 'NORMAL'; startCountdown(); });
        startHellBtn.addEventListener('click', () => { gameMode = 'HELL'; startCountdown(); });
        restartNormalBtn.addEventListener('click', () => { gameMode = 'NORMAL'; startCountdown(); });
        restartHellBtn.addEventListener('click', () => { gameMode = 'HELL'; startCountdown(); });

        function triggerDodge() {
            if (gameState !== 'PLAYING') return;
            if (player.dodgeCharges <= 0) return;

            player.dodgeCharges--;
            player.isInvincible = true;
            player.invincibleUntil = performance.now() + 1000;
            audio.playDodge();

            updateDodgeUI();
        }

        function updateDodgeUI() {
            const count = player.dodgeCharges;
            if (count > 0) {
                dodgeBadge.className = "mt-1 px-3 py-1 text-xs font-bold rounded-md bg-emerald-500/20 text-emerald-300 border border-emerald-400/50 flex items-center gap-1.5";
                dodgeBadgeText.innerText = `SHIELD [x${count}]`;
                dodgeDot.className = "w-2 h-2 rounded-full bg-emerald-400 animate-pulse";
                if (btnDodgeSubText) btnDodgeSubText.innerText = `(충전: ${count}회)`;
            } else {
                dodgeBadge.className = "mt-1 px-3 py-1 text-xs font-bold rounded-md bg-slate-800 text-slate-500 border border-slate-700 flex items-center gap-1.5 opacity-60";
                dodgeBadgeText.innerText = "SHIELD [x0]";
                dodgeDot.className = "w-2 h-2 rounded-full bg-slate-500";
                if (btnDodgeSubText) btnDodgeSubText.innerText = "(충전: 0회)";
            }
        }

        function spawnShieldItem() {
            const margin = 50;
            const itemX = Math.random() * (CANVAS_WIDTH - margin * 2) + margin;
            const itemY = Math.random() * (CANVAS_HEIGHT - margin * 2) + margin;
            items.push({
                x: itemX,
                y: itemY,
                radius: 16,
                spawnTime: performance.now()
            });
        }

        function startCountdown() {
            audio.init();
            startOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');
            countdownOverlay.classList.remove('hidden');

            let count = 3;
            countdownText.innerText = count;
            audio.playBeep(523.25, 0.12);

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownText.innerText = count;
                    audio.playBeep(523.25 + (3 - count) * 100, 0.12);
                } else if (count === 0) {
                    countdownText.innerText = "GO!";
                    audio.playBeep(1046.50, 0.25);
                } else {
                    clearInterval(timer);
                    countdownOverlay.classList.add('hidden');
                    startGame();
                }
            }, 800);
        }

        function startGame() {
            gameState = 'PLAYING';
            startTime = performance.now();
            elapsedTime = 0;
            lastItemSpawnTime = performance.now();
            
            player.x = CANVAS_WIDTH / 2;
            player.y = CANVAS_HEIGHT / 2;
            player.dodgeCharges = 1;
            player.isInvincible = false;
            player.invincibleUntil = 0;
            player.angle = 0;
            
            bullets = [];
            particles = [];
            items = [];
            spawnTimer = 0;

            updateDodgeUI();
            audio.startBGM();

            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            gameLoop();
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            audio.stopBGM();
            audio.playExplosion();

            for (let i = 0; i < 40; i++) {
                particles.push({
                    x: player.x,
                    y: player.y,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12,
                    radius: Math.random() * 4 + 2,
                    color: ['#facc15', '#f97316', '#ef4444', '#ffffff'][Math.floor(Math.random() * 4)],
                    alpha: 1,
                    life: Math.random() * 30 + 20
                });
            }

            let currentHigh = gameMode === 'HELL' ? highScoreHell : highScoreNormal;
            if (elapsedTime > currentHigh) {
                if (gameMode === 'HELL') {
                    highScoreHell = elapsedTime;
                    localStorage.setItem('car_dodge_highscore_hell', highScoreHell.toFixed(2));
                } else {
                    highScoreNormal = elapsedTime;
                    localStorage.setItem('car_dodge_highscore_normal', highScoreNormal.toFixed(2));
                }
                currentHigh = elapsedTime;
            }

            finalScore.innerText = `${elapsedTime.toFixed(2)}s`;
            highScoreDisplay.innerText = `${currentHigh.toFixed(2)}s`;
            gameOverModeText.innerText = `[${gameMode} MODE]`;

            setTimeout(() => {
                gameOverOverlay.classList.remove('hidden');
            }, 600);
        }

        // Game Update
        function update(deltaTime) {
            if (gameState !== 'PLAYING') return;

            const now = performance.now();
            elapsedTime = (now - startTime) / 1000;
            timerDisplay.innerText = `${elapsedTime.toFixed(2)}s`;

            if (now - lastItemSpawnTime >= 10000) {
                lastItemSpawnTime = now;
                spawnShieldItem();
            }

            if (player.isInvincible && now > player.invincibleUntil) {
                player.isInvincible = false;
            }

            let dx = 0;
            let dy = 0;
            if (keys.Left) dx -= 1;
            if (keys.Right) dx += 1;
            if (keys.Up) dy -= 1;
            if (keys.Down) dy += 1;

            if (joystickVector.x !== 0 || joystickVector.y !== 0) {
                dx = joystickVector.x;
                dy = joystickVector.y;
            } else if (dx !== 0 && dy !== 0) {
                dx *= 0.7071;
                dy *= 0.7071;
            }

            if (Math.abs(dx) > 0.05 || Math.abs(dy) > 0.05) {
                player.angle = Math.atan2(dy, dx);
            }

            // Always update mouth animation regardless of movement
            player.mouthAngle += player.mouthSpeed;
            if (player.mouthAngle > 0.4 || player.mouthAngle < 0.03) {
                player.mouthSpeed = -player.mouthSpeed;
            }

            player.x += dx * player.speed;
            player.y += dy * player.speed;

            player.x = Math.max(player.radius, Math.min(CANVAS_WIDTH - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(CANVAS_HEIGHT - player.radius, player.y));

            // Item Pickup
            for (let i = items.length - 1; i >= 0; i--) {
                const it = items[i];
                const distSq = (player.x - it.x) ** 2 + (player.y - it.y) ** 2;
                const collectionRadius = player.radius + it.radius;
                
                if (distSq <= collectionRadius ** 2) {
                    player.dodgeCharges++;
                    audio.playItem();
                    updateDodgeUI();
                    
                    for (let p = 0; p < 12; p++) {
                        particles.push({
                            x: it.x,
                            y: it.y,
                            vx: (Math.random() - 0.5) * 6,
                            vy: (Math.random() - 0.5) * 6,
                            radius: Math.random() * 3 + 2,
                            color: '#10b981',
                            alpha: 1,
                            life: 20
                        });
                    }
                    items.splice(i, 1);
                }
            }

            // Bullet Spawning
            const speedMultiplier = 1 + (elapsedTime / 24) ** 1.3;
            const spawnInterval = Math.max(4, 25 - Math.floor(elapsedTime * 0.3));

            spawnTimer++;
            if (spawnTimer >= spawnInterval) {
                spawnTimer = 0;
                
                const side = Math.floor(Math.random() * 4);
                let bx, by, bvx, bvy;
                const baseSpeed = (Math.random() * 1.8 + 2.5) * speedMultiplier;

                if (side === 0) {
                    bx = Math.random() * CANVAS_WIDTH;
                    by = -15;
                    bvx = (Math.random() - 0.5) * 2.5 * speedMultiplier;
                    bvy = baseSpeed;
                } else if (side === 1) {
                    bx = Math.random() * CANVAS_WIDTH;
                    by = CANVAS_HEIGHT + 15;
                    bvx = (Math.random() - 0.5) * 2.5 * speedMultiplier;
                    bvy = -baseSpeed;
                } else if (side === 2) {
                    bx = -15;
                    by = Math.random() * CANVAS_HEIGHT;
                    bvx = baseSpeed;
                    bvy = (Math.random() - 0.5) * 2.5 * speedMultiplier;
                } else {
                    bx = CANVAS_WIDTH + 15;
                    by = Math.random() * CANVAS_HEIGHT;
                    bvx = -baseSpeed;
                    bvy = (Math.random() - 0.5) * 2.5 * speedMultiplier;
                }

                bullets.push({
                    x: bx,
                    y: by,
                    vx: bvx,
                    vy: bvy,
                    bounceCount: 0,
                    radius: Math.random() * 2 + 4,
                    color: gameMode === 'HELL' ? '#a855f7' : (elapsedTime > 45 ? '#f43f5e' : (elapsedTime > 25 ? '#fbbf24' : '#38bdf8'))
                });
            }

            // Bullets Loop
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;

                // Bounce in HELL Mode
                if (gameMode === 'HELL' && b.bounceCount < 2) {
                    let bounced = false;
                    if (b.x <= b.radius && b.vx < 0) {
                        b.vx = -b.vx;
                        bounced = true;
                    } else if (b.x >= CANVAS_WIDTH - b.radius && b.vx > 0) {
                        b.vx = -b.vx;
                        bounced = true;
                    }
                    if (b.y <= b.radius && b.vy < 0) {
                        b.vy = -b.vy;
                        bounced = true;
                    } else if (b.y >= CANVAS_HEIGHT - b.radius && b.vy > 0) {
                        b.vy = -b.vy;
                        bounced = true;
                    }

                    if (bounced) {
                        b.bounceCount++;
                        b.color = '#ef4444';
                        audio.playBounce();
                        for (let p = 0; p < 6; p++) {
                            particles.push({
                                x: b.x,
                                y: b.y,
                                vx: (Math.random() - 0.5) * 4,
                                vy: (Math.random() - 0.5) * 4,
                                radius: 2,
                                color: '#c084fc',
                                alpha: 1,
                                life: 12
                            });
                        }
                    }
                }

                // Collision with Player
                if (!player.isInvincible) {
                    const hitBoxPadding = 3;
                    const distSq = (b.x - player.x) ** 2 + (b.y - player.y) ** 2;
                    const combinedRadius = (player.radius - hitBoxPadding) + b.radius;
                    
                    if (distSq < combinedRadius ** 2) {
                        gameOver();
                        break;
                    }
                }

                if (b.y > CANVAS_HEIGHT + 40 || b.y < -40 || b.x < -40 || b.x > CANVAS_WIDTH + 40) {
                    bullets.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.025;
                if (p.alpha <= 0) particles.splice(i, 1);
            }
        }

        function drawShieldItem(x, y, radius) {
            ctx.save();
            ctx.translate(x, y);

            const pulse = Math.sin(performance.now() * 0.006) * 3;
            
            ctx.beginPath();
            ctx.arc(0, pulse, radius + 4, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(16, 185, 129, 0.2)';
            ctx.shadowColor = '#10b981';
            ctx.shadowBlur = 12;
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(0, -radius + pulse);
            ctx.lineTo(radius, -radius * 0.5 + pulse);
            ctx.lineTo(radius * 0.8, radius * 0.4 + pulse);
            ctx.lineTo(0, radius + pulse);
            ctx.lineTo(-radius * 0.8, radius * 0.4 + pulse);
            ctx.lineTo(-radius, -radius * 0.5 + pulse);
            ctx.closePath();

            ctx.fillStyle = '#10b981';
            ctx.strokeStyle = '#a7f3d0';
            ctx.lineWidth = 2;
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-2, -6 + pulse, 4, 12);
            ctx.fillRect(-6, -2 + pulse, 12, 4);

            ctx.restore();
        }

        // Rendering
        function render() {
            ctx.fillStyle = '#090d16';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            const gridOffset = (performance.now() * 0.15) % 40;
            for (let y = gridOffset; y < CANVAS_HEIGHT; y += 40) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(CANVAS_WIDTH, y);
                ctx.stroke();
            }

            items.forEach(it => drawShieldItem(it.x, it.y, it.radius));

            bullets.forEach(b => {
                ctx.save();
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = b.color;
                ctx.shadowColor = b.color;
                ctx.shadowBlur = 8;
                ctx.fill();
                ctx.restore();
            });

            if (gameState === 'PLAYING') {
                ctx.save();
                ctx.translate(player.x, player.y);

                if (player.isInvincible) {
                    ctx.beginPath();
                    ctx.arc(0, 0, player.radius + 12, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(236, 72, 153, 0.25)';
                    ctx.strokeStyle = '#ec4899';
                    ctx.lineWidth = 3;
                    ctx.shadowColor = '#ec4899';
                    ctx.shadowBlur = 15;
                    ctx.fill();
                    ctx.stroke();
                }

                ctx.rotate(player.angle);

                ctx.beginPath();
                ctx.arc(0, 0, player.radius, player.mouthAngle * Math.PI, (2 - player.mouthAngle) * Math.PI);
                ctx.lineTo(0, 0);
                ctx.closePath();
                ctx.fillStyle = '#facc15';
                ctx.shadowColor = '#facc15';
                ctx.shadowBlur = 10;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(2, -player.radius * 0.5, 2.5, 0, Math.PI * 2);
                ctx.fillStyle = '#090d16';
                ctx.fill();

                ctx.restore();
            }

            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.restore();
            });
        }

        let lastTime = performance.now();
        function gameLoop() {
            const now = performance.now();
            const deltaTime = (now - lastTime) / 1000;
            lastTime = now;

            update(deltaTime);
            render();

            if (gameState === 'PLAYING' || particles.length > 0) {
                animationFrameId = requestAnimationFrame(gameLoop);
            }
        }

        render();
    </script>
</body>
</html>
