<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>1-Min Retro Pac-Man Dodge</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #0d0f18;
            color: #ffffff;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .pixel-font {
            font-family: 'Press Start 2P', monospace;
        }
        .neon-border {
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.5), inset 0 0 15px rgba(236, 72, 153, 0.3);
        }
        .neon-text-cyan {
            text-shadow: 0 0 8px rgba(6, 182, 212, 0.8), 0 0 20px rgba(6, 182, 212, 0.5);
        }
        .neon-text-pink {
            text-shadow: 0 0 8px rgba(236, 72, 153, 0.8), 0 0 20px rgba(236, 72, 153, 0.5);
        }
        .touch-btn:active {
            transform: scale(0.92);
            filter: brightness(1.3);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-2 sm:p-4 overflow-hidden">

    <!-- Header / HUD Above Canvas -->
    <header class="w-full max-w-lg flex items-center justify-between bg-slate-900/80 border-2 border-pink-500/50 rounded-xl p-3 mb-2 neon-border backdrop-blur-md">
        <div class="flex flex-col">
            <span class="text-xs text-cyan-400 font-bold uppercase tracking-wider">Survived Time</span>
            <span id="timerDisplay" class="pixel-font text-xl sm:text-2xl text-yellow-300 neon-text-cyan">0.00s</span>
        </div>
        
        <!-- Shield Skill UI Indicator -->
        <div class="flex flex-col items-end">
            <span class="text-xs text-pink-400 font-bold uppercase tracking-wider">Special Skill</span>
            <div id="dodgeBadge" class="mt-1 px-3 py-1 text-xs font-bold rounded-md bg-emerald-500/20 text-emerald-300 border border-emerald-400/50 flex items-center gap-1.5 transition-all">
                <span id="dodgeDot" class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span id="dodgeBadgeText" class="pixel-font text-[10px]">SHIELD [x1]</span>
            </div>
        </div>
    </header>

    <!-- Main Game Canvas Container -->
    <main class="relative w-full max-w-lg aspect-[4/5] sm:aspect-square flex items-center justify-center bg-slate-950 rounded-2xl overflow-hidden border-2 border-cyan-500/40 shadow-2xl">
        <canvas id="gameCanvas" class="w-full h-full block"></canvas>

        <!-- Start Overlay -->
        <div id="startOverlay" class="absolute inset-0 bg-slate-950/90 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center z-20">
            <h1 class="pixel-font text-2xl sm:text-3xl text-pink-500 mb-2 neon-text-pink leading-relaxed">PAC-DODGE 60s</h1>
            <p class="text-slate-300 text-sm sm:text-base max-w-xs mb-6 leading-relaxed">
                날아오는 총알을 피하고 <span class="text-cyan-400 font-bold">60초</span> 동안 생존하세요!<br>
                <span class="text-yellow-300 text-xs">※ 난이도가 초당 가파르게 급상승합니다.</span>
            </p>

            <div class="bg-slate-900/80 border border-slate-700 rounded-lg p-3 mb-6 w-full max-w-xs text-xs text-slate-400 space-y-1 text-left">
                <p>⚡ <strong class="text-slate-200">조작법:</strong> 키보드 방향키 / 조이스틱</p>
                <p>🛡️ <strong class="text-slate-200">실드(무적 1초):</strong> 스페이스 바 / SHIELD 버튼</p>
                <p>🛡️ <strong class="text-cyan-300">방패 아이템:</strong> 10초마다 출현 (실드 +1 충전)</p>
            </div>

            <button id="startBtn" class="pixel-font px-6 py-4 bg-gradient-to-r from-pink-500 to-rose-600 hover:from-pink-400 hover:to-rose-500 text-white rounded-xl shadow-lg shadow-pink-500/40 transform active:scale-95 transition-all cursor-pointer">
                START GAME
            </button>
        </div>

        <!-- Game Over Overlay -->
        <div id="gameOverOverlay" class="absolute inset-0 bg-slate-950/95 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-20 hidden">
            <h2 class="pixel-font text-2xl sm:text-3xl text-red-500 mb-2 animate-bounce">GAME OVER</h2>
            <p class="text-slate-400 text-xs sm:text-sm mb-4">총알에 맞았습니다!</p>
            
            <div class="bg-slate-900 border border-pink-500/30 rounded-xl p-4 w-full max-w-xs mb-6 space-y-2">
                <div class="flex justify-between items-center text-sm">
                    <span class="text-slate-400">이번 기록:</span>
                    <span id="finalScore" class="pixel-font text-lg text-yellow-300">0.00s</span>
                </div>
                <div class="flex justify-between items-center text-sm border-t border-slate-800 pt-2">
                    <span class="text-slate-400">최고 기록:</span>
                    <span id="highScore" class="pixel-font text-lg text-cyan-400">0.00s</span>
                </div>
            </div>

            <button id="restartBtn" class="pixel-font px-6 py-4 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white rounded-xl shadow-lg shadow-cyan-500/40 transform active:scale-95 transition-all cursor-pointer">
                TRY AGAIN
            </button>
        </div>

        <!-- Countdown Overlay -->
        <div id="countdownOverlay" class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center z-30 hidden">
            <span id="countdownText" class="pixel-font text-6xl text-yellow-300 neon-text-cyan animate-pulse">3</span>
        </div>
    </main>

    <!-- Mobile On-Screen Controls Container -->
    <footer class="w-full max-w-lg mt-2 flex items-center justify-between gap-4 p-2 bg-slate-900/60 border border-slate-800 rounded-xl">
        <!-- Virtual Joystick Area -->
        <div class="relative w-36 h-36 sm:w-40 sm:h-40 bg-slate-950/80 rounded-xl border border-slate-800 flex items-center justify-center overflow-hidden touch-none" id="joystickArea">
            <!-- Joystick Base -->
            <div class="w-24 h-24 rounded-full border-2 border-slate-700/60 bg-slate-900/50 flex items-center justify-center relative">
                <!-- Inner Cross Hair Indicator -->
                <div class="w-full h-[1px] bg-slate-800 absolute"></div>
                <div class="h-full w-[1px] bg-slate-800 absolute"></div>
                <!-- Joystick Knob Handle -->
                <div id="joystickKnob" class="w-12 h-12 rounded-full bg-gradient-to-br from-cyan-400 to-cyan-600 border-2 border-cyan-300 shadow-lg shadow-cyan-500/40 relative transform transition-transform duration-75"></div>
            </div>
            <span class="absolute bottom-1 text-[9px] text-slate-500 font-bold tracking-wider uppercase">JOYSTICK</span>
        </div>

        <!-- Big Touch Shield Button -->
        <button id="btnDodge" class="touch-btn flex-1 h-36 sm:h-40 bg-gradient-to-br from-pink-600 to-purple-700 border-2 border-pink-400 active:from-pink-400 active:to-purple-500 rounded-xl flex flex-col items-center justify-center gap-1 shadow-lg shadow-pink-500/20 cursor-pointer">
            <span class="text-2xl sm:text-3xl">🛡️</span>
            <span class="pixel-font text-xs sm:text-sm text-white font-bold">SHIELD</span>
            <span id="btnDodgeSubText" class="text-[10px] text-pink-200/80">(충전: 1회)</span>
        </button>
    </footer>

    <!-- Game Logic Script -->
    <script>
        // --- Web Audio API Synth Engine ---
        class SoundEngine {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playBeep(freq = 600, duration = 0.15) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            }
            playDodge() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }
            playItem() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, this.ctx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, this.ctx.currentTime + 0.08); // E5
                osc.frequency.setValueAtTime(783.99, this.ctx.currentTime + 0.16); // G5
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }
            playExplosion() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.6);
                gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.6);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.6);
            }
        }
        const audio = new SoundEngine();

        // --- Game Setup & State ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const timerDisplay = document.getElementById('timerDisplay');
        const dodgeBadge = document.getElementById('dodgeBadge');
        const dodgeBadgeText = document.getElementById('dodgeBadgeText');
        const dodgeDot = document.getElementById('dodgeDot');
        const btnDodgeSubText = document.getElementById('btnDodgeSubText');
        
        const startOverlay = document.getElementById('startOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const countdownOverlay = document.getElementById('countdownOverlay');
        const countdownText = document.getElementById('countdownText');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        
        const finalScore = document.getElementById('finalScore');
        const highScoreDisplay = document.getElementById('highScore');

        // Internal Canvas Resolution
        const CANVAS_WIDTH = 500;
        const CANVAS_HEIGHT = 625;
        canvas.width = CANVAS_WIDTH;
        canvas.height = CANVAS_HEIGHT;

        let gameState = 'START'; // START, COUNTDOWN, PLAYING, GAMEOVER
        let startTime = 0;
        let elapsedTime = 0;
        let animationFrameId = null;

        // Player Pac-Man Object (Centered)
        const player = {
            x: CANVAS_WIDTH / 2,
            y: CANVAS_HEIGHT / 2,
            radius: 16,
            speed: 4.5, // 이동 속도 감소 (6.5 -> 4.5)
            angle: -Math.PI / 2, // Default facing UP
            dodgeCharges: 1,
            isInvincible: false,
            invincibleUntil: 0
        };

        // Inputs State
        const keys = {
            Up: false,
            Down: false,
            Left: false,
            Right: false
        };

        // Joystick Input Vector (-1 to 1)
        const joystickInput = { x: 0, y: 0 };

        // Game Entities
        let bullets = [];
        let particles = [];
        let items = [];
        let spawnTimer = 0;
        let lastItemSpawnTime = 0;

        // High Score
        let highScore = parseFloat(localStorage.getItem('car_dodge_highscore') || '0');

        // --- Input Event Listeners ---
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.Up = true;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.Down = true;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.Left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.Right = true;
            if (e.code === 'Space') {
                e.preventDefault();
                triggerDodge();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.Up = false;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.Down = false;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.Left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.Right = false;
        });

        // --- Touch Virtual Joystick Implementation ---
        const joystickArea = document.getElementById('joystickArea');
        const joystickKnob = document.getElementById('joystickKnob');
        let joystickTouchId = null;

        function handleJoystickMove(clientX, clientY) {
            const rect = joystickArea.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            let deltaX = clientX - centerX;
            let deltaY = clientY - centerY;
            const maxRadius = rect.width * 0.3; // Max drag distance

            const distance = Math.hypot(deltaX, deltaY);
            if (distance > maxRadius) {
                deltaX = (deltaX / distance) * maxRadius;
                deltaY = (deltaY / distance) * maxRadius;
            }

            // Visual Knob Position
            joystickKnob.style.transform = `translate(${deltaX}px, ${deltaY}px)`;

            // Normalized Velocity Input Vector (-1 to 1) with minor dampening & deadzone for better precision
            let normX = deltaX / maxRadius;
            let normY = deltaY / maxRadius;
            const deadzone = 0.08;
            if (Math.abs(normX) < deadzone) normX = 0;
            if (Math.abs(normY) < deadzone) normY = 0;

            joystickInput.x = normX * 0.85; // 감도 85% 수준으로 완화
            joystickInput.y = normY * 0.85;
        }

        function resetJoystick() {
            joystickTouchId = null;
            joystickKnob.style.transform = 'translate(0px, 0px)';
            joystickInput.x = 0;
            joystickInput.y = 0;
        }

        // Joystick Event Listeners (Touch & Mouse)
        joystickArea.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (joystickTouchId === null && e.changedTouches.length > 0) {
                const touch = e.changedTouches[0];
                joystickTouchId = touch.identifier;
                handleJoystickMove(touch.clientX, touch.clientY);
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (joystickTouchId !== null) {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === joystickTouchId) {
                        handleJoystickMove(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
                        break;
                    }
                }
            }
        }, { passive: false });

        window.addEventListener('touchend', (e) => {
            if (joystickTouchId !== null) {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === joystickTouchId) {
                        resetJoystick();
                        break;
                    }
                }
            }
        });

        // Mouse Dragging support for Joystick testing on desktop
        let isMouseDownOnJoystick = false;
        joystickArea.addEventListener('mousedown', (e) => {
            isMouseDownOnJoystick = true;
            handleJoystickMove(e.clientX, e.clientY);
        });
        window.addEventListener('mousemove', (e) => {
            if (isMouseDownOnJoystick) {
                handleJoystickMove(e.clientX, e.clientY);
            }
        });
        window.addEventListener('mouseup', () => {
            if (isMouseDownOnJoystick) {
                isMouseDownOnJoystick = false;
                resetJoystick();
            }
        });

        document.getElementById('btnDodge').addEventListener('click', (e) => {
            e.preventDefault();
            triggerDodge();
        });
        document.getElementById('btnDodge').addEventListener('touchstart', (e) => {
            e.preventDefault();
            triggerDodge();
        });

        // Start & Restart Button Listeners
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        // --- Core Functions ---
        function triggerDodge() {
            if (gameState !== 'PLAYING') return;
            if (player.dodgeCharges <= 0) return;

            player.dodgeCharges--;
            player.isInvincible = true;
            player.invincibleUntil = performance.now() + 1000; // 1 second duration
            audio.playDodge();

            updateDodgeUI();
        }

        function updateDodgeUI() {
            const count = player.dodgeCharges;
            if (count > 0) {
                dodgeBadge.className = "mt-1 px-3 py-1 text-xs font-bold rounded-md bg-emerald-500/20 text-emerald-300 border border-emerald-400/50 flex items-center gap-1.5";
                dodgeBadgeText.innerText = `SHIELD [x${count}]`;
                dodgeDot.className = "w-2 h-2 rounded-full bg-emerald-400 animate-pulse";
                if (btnDodgeSubText) btnDodgeSubText.innerText = `(충전: ${count}회)`;
            } else {
                dodgeBadge.className = "mt-1 px-3 py-1 text-xs font-bold rounded-md bg-slate-800 text-slate-500 border border-slate-700 flex items-center gap-1.5 opacity-60";
                dodgeBadgeText.innerText = "SHIELD [x0]";
                dodgeDot.className = "w-2 h-2 rounded-full bg-slate-500";
                if (btnDodgeSubText) btnDodgeSubText.innerText = "(충전: 0회)";
            }
        }

        function spawnShieldItem() {
            const margin = 50;
            const itemX = Math.random() * (CANVAS_WIDTH - margin * 2) + margin;
            const itemY = Math.random() * (CANVAS_HEIGHT - margin * 2) + margin;
            items.push({
                x: itemX,
                y: itemY,
                radius: 16,
                spawnTime: performance.now()
            });
        }

        function startGame() {
            audio.init();
            startOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');

            // Reset player centered
            player.x = CANVAS_WIDTH / 2;
            player.y = CANVAS_HEIGHT / 2;
            player.dodgeCharges = 1;
            player.isInvincible = false;
            player.invincibleUntil = 0;
            player.angle = -Math.PI / 2;
            
            bullets = [];
            particles = [];
            items = [];
            spawnTimer = 0;
            elapsedTime = 0;
            timerDisplay.innerText = "0.00s";

            updateDodgeUI();

            // Start 3-2-1 Countdown
            startCountdown();
        }

        function startCountdown() {
            gameState = 'COUNTDOWN';
            countdownOverlay.classList.remove('hidden');

            let count = 3;
            countdownText.innerText = count;
            audio.playBeep(600, 0.15);

            const interval = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownText.innerText = count;
                    audio.playBeep(600, 0.15);
                } else if (count === 0) {
                    countdownText.innerText = "GO!";
                    audio.playBeep(1000, 0.3);
                } else {
                    clearInterval(interval);
                    countdownOverlay.classList.add('hidden');
                    
                    // Actually start playing
                    gameState = 'PLAYING';
                    startTime = performance.now();
                    lastItemSpawnTime = performance.now();

                    if (animationFrameId) cancelAnimationFrame(animationFrameId);
                    gameLoop();
                }
            }, 800);

            // Render static scene during countdown
            render();
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            audio.playExplosion();

            // Create explosion particles at player position
            for (let i = 0; i < 40; i++) {
                particles.push({
                    x: player.x,
                    y: player.y,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12,
                    radius: Math.random() * 4 + 2,
                    color: ['#facc15', '#ef4444', '#f97316', '#ffffff'][Math.floor(Math.random() * 4)],
                    alpha: 1,
                    life: Math.random() * 30 + 20
                });
            }

            // Save High Score
            if (elapsedTime > highScore) {
                highScore = elapsedTime;
                localStorage.setItem('car_dodge_highscore', highScore.toFixed(2));
            }

            finalScore.innerText = `${elapsedTime.toFixed(2)}s`;
            highScoreDisplay.innerText = `${highScore.toFixed(2)}s`;

            setTimeout(() => {
                gameOverOverlay.classList.remove('hidden');
            }, 600);
        }

        // --- Game Logic Update ---
        function update(deltaTime) {
            if (gameState !== 'PLAYING') return;

            const now = performance.now();
            elapsedTime = (now - startTime) / 1000;
            timerDisplay.innerText = `${elapsedTime.toFixed(2)}s`;

            // Check Shield Item Spawn Every 10 Seconds
            if (now - lastItemSpawnTime >= 10000) {
                lastItemSpawnTime = now;
                spawnShieldItem();
            }

            // Check Invincibility Expiry
            if (player.isInvincible && now > player.invincibleUntil) {
                player.isInvincible = false;
            }

            // Player Movement (Combined Keyboard & Joystick Input)
            let dx = joystickInput.x;
            let dy = joystickInput.y;

            // Keyboard overrides/adds if keys are active
            if (keys.Left) dx = -1;
            if (keys.Right) dx = 1;
            if (keys.Up) dy = -1;
            if (keys.Down) dy = 1;

            // Normalize Keyboard diagonal movement speed
            if ((keys.Left || keys.Right) && (keys.Up || keys.Down)) {
                dx *= 0.7071;
                dy *= 0.7071;
            }

            // Update facing angle based on movement direction
            if (Math.abs(dx) > 0.1 || Math.abs(dy) > 0.1) {
                player.angle = Math.atan2(dy, dx);
            }

            player.x += dx * player.speed;
            player.y += dy * player.speed;

            // Clamp player within boundaries
            player.x = Math.max(player.radius, Math.min(CANVAS_WIDTH - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(CANVAS_HEIGHT - player.radius, player.y));

            // --- Items Collection Logic ---
            for (let i = items.length - 1; i >= 0; i--) {
                const it = items[i];
                const distSq = (player.x - it.x) ** 2 + (player.y - it.y) ** 2;
                const collectionRadius = player.radius + it.radius;
                
                // Collect item
                if (distSq <= collectionRadius ** 2) {
                    player.dodgeCharges++;
                    audio.playItem();
                    updateDodgeUI();
                    
                    // Floating pickup particle effect
                    for (let p = 0; p < 12; p++) {
                        particles.push({
                            x: it.x,
                            y: it.y,
                            vx: (Math.random() - 0.5) * 6,
                            vy: (Math.random() - 0.5) * 6,
                            radius: Math.random() * 3 + 2,
                            color: '#10b981',
                            alpha: 1,
                            life: 20
                        });
                    }
                    items.splice(i, 1);
                }
            }
            // --- DIFFICULTY SCALING (Smooth initial curve) ---
            // 초반 속도 증가 곡선을 조금 부드럽게 조정
            const speedMultiplier = 1 + (elapsedTime / 22) ** 1.4;
            const spawnInterval = Math.max(4, 25 - Math.floor(elapsedTime * 0.3));

            spawnTimer++;
            if (spawnTimer >= spawnInterval) {
                spawnTimer = 0;
                
                const side = Math.floor(Math.random() * 4);
                let bx, by, bvx, bvy;
                const baseSpeed = (Math.random() * 1.8 + 2.2) * speedMultiplier; // 초기 총알 속도 감소 (3.5+2.5 -> 2.2+1.8)

                if (side === 0) {
                    bx = Math.random() * CANVAS_WIDTH;
                    by = -15;
                    bvx = (Math.random() - 0.5) * 2 * speedMultiplier;
                    bvy = baseSpeed;
                } else if (side === 1) {
                    bx = Math.random() * CANVAS_WIDTH;
                    by = CANVAS_HEIGHT + 15;
                    bvx = (Math.random() - 0.5) * 2 * speedMultiplier;
                    bvy = -baseSpeed;
                } else if (side === 2) {
                    bx = -15;
                    by = Math.random() * CANVAS_HEIGHT;
                    bvx = baseSpeed;
                    bvy = (Math.random() - 0.5) * 2 * speedMultiplier;
                } else {
                    bx = CANVAS_WIDTH + 15;
                    by = Math.random() * CANVAS_HEIGHT;
                    bvx = -baseSpeed;
                    bvy = (Math.random() - 0.5) * 2 * speedMultiplier;
                }

                bullets.push({
                    x: bx,
                    y: by,
                    vx: bvx,
                    vy: bvy,
                    radius: Math.random() * 2 + 4,
                    color: elapsedTime > 45 ? '#f43f5e' : (elapsedTime > 25 ? '#fbbf24' : '#38bdf8')
                });
            }

            // Update Bullets & Collisions
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;

                // Collision Detection with Pac-Man
                if (!player.isInvincible) {
                    const distSq = (player.x - b.x) ** 2 + (player.y - b.y) ** 2;
                    const hitRadius = player.radius * 0.8 + b.radius;
                    if (distSq < hitRadius ** 2) {
                        gameOver();
                        break;
                    }
                }

                // Remove out of bounds bullets
                if (b.y > CANVAS_HEIGHT + 30 || b.y < -30 || b.x < -30 || b.x > CANVAS_WIDTH + 30) {
                    bullets.splice(i, 1);
                }
            }

            // Update Explosions & Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.025;
                if (p.alpha <= 0) particles.splice(i, 1);
            }
        }

        // --- Helper Function: Draw Shield Item ---
        function drawShieldItem(x, y, radius) {
            ctx.save();
            ctx.translate(x, y);

            const pulse = Math.sin(performance.now() * 0.006) * 3;
            
            ctx.beginPath();
            ctx.arc(0, pulse, radius + 4, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(16, 185, 129, 0.2)';
            ctx.shadowColor = '#10b981';
            ctx.shadowBlur = 12;
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(0, -radius + pulse);
            ctx.lineTo(radius, -radius * 0.5 + pulse);
            ctx.lineTo(radius * 0.8, radius * 0.4 + pulse);
            ctx.lineTo(0, radius + pulse);
            ctx.lineTo(-radius * 0.8, radius * 0.4 + pulse);
            ctx.lineTo(-radius, -radius * 0.5 + pulse);
            ctx.closePath();

            ctx.fillStyle = '#10b981';
            ctx.strokeStyle = '#a7f3d0';
            ctx.lineWidth = 2;
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-2, -6 + pulse, 4, 12);
            ctx.fillRect(-6, -2 + pulse, 12, 4);

            ctx.restore();
        }

        // --- Rendering Engine ---
        function render() {
            // Clear Screen
            ctx.fillStyle = '#090d16';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // Draw Synthwave Grid
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            const gridOffset = (performance.now() * 0.15) % 40;
            for (let y = gridOffset; y < CANVAS_HEIGHT; y += 40) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(CANVAS_WIDTH, y);
                ctx.stroke();
            }

            // Draw Shield Items
            items.forEach(it => drawShieldItem(it.x, it.y, it.radius));

            // Draw Bullets
            bullets.forEach(b => {
                ctx.save();
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = b.color;
                ctx.shadowColor = b.color;
                ctx.shadowBlur = 8;
                ctx.fill();
                ctx.restore();
            });

            // Draw Player Pac-Man (if not game over)
            if (gameState === 'PLAYING') {
                ctx.save();
                ctx.translate(player.x, player.y);

                // Invincibility Shield Effect
                if (player.isInvincible) {
                    ctx.beginPath();
                    ctx.arc(0, 0, 26, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(236, 72, 153, 0.25)';
                    ctx.strokeStyle = '#ec4899';
                    ctx.lineWidth = 3;
                    ctx.shadowColor = '#ec4899';
                    ctx.shadowBlur = 15;
                    ctx.fill();
                    ctx.stroke();
                }

                // Pac-Man Mouth Animation Calculation
                const mouthSpeed = 0.015;
                const mouthAngle = (Math.sin(performance.now() * mouthSpeed) + 1) * 0.2 + 0.05;

                // Rotate Pac-Man to facing direction
                ctx.rotate(player.angle);

                // Draw Pac-Man Body
                ctx.beginPath();
                ctx.arc(0, 0, player.radius, mouthAngle, Math.PI * 2 - mouthAngle);
                ctx.lineTo(0, 0);
                ctx.fillStyle = '#facc15'; // Yellow
                ctx.shadowColor = '#facc15';
                ctx.shadowBlur = 12;
                ctx.fill();

                // Pac-Man Eye
                ctx.beginPath();
                ctx.arc(3, -player.radius * 0.55, 2.5, 0, Math.PI * 2);
                ctx.fillStyle = '#0f172a';
                ctx.fill();

                ctx.restore();
            }

            // Draw Particles
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.restore();
            });
        }

        // --- Main Loop ---
        let lastTime = performance.now();
        function gameLoop() {
            const now = performance.now();
            const deltaTime = (now - lastTime) / 1000;
            lastTime = now;

            update(deltaTime);
            render();

            if (gameState === 'PLAYING' || particles.length > 0) {
                animationFrameId = requestAnimationFrame(gameLoop);
            }
        }

        // Initial Canvas Draw
        render();
    </script>
</body>
